<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ほんログJr. preview</title>
  <desc id="desc">A colorful reading log dashboard with books, timer, weekly progress, and reading stamps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d8f0ed"/>
      <stop offset="0.45" stop-color="#fff4d1"/>
      <stop offset="1" stop-color="#ffd2c2"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#247c78"/>
      <stop offset="1" stop-color="#145753"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e66f51"/>
      <stop offset="1" stop-color="#b94730"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4552a3"/>
      <stop offset="1" stop-color="#29336f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#18212f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="40" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="96" fill="#f7c948" opacity="0.8"/>
  <circle cx="155" cy="620" r="130" fill="#247c78" opacity="0.16"/>
  <g filter="url(#shadow)">
    <rect x="84" y="84" width="1032" height="552" rx="24" fill="#fffdf7"/>
  </g>
  <text x="138" y="168" fill="#145753" font-family="Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="4">PINDA LAB TOOL</text>
  <text x="138" y="250" fill="#18212f" font-family="Arial, sans-serif" font-size="92" font-weight="900">ほんログJr.</text>
  <text x="142" y="306" fill="#667085" font-family="Arial, sans-serif" font-size="31" font-weight="700">読む・聞く・話すを記録する読書パスポート</text>
  <g transform="translate(140 374)">
    <rect width="300" height="168" rx="18" fill="#eaf1f2"/>
    <text x="34" y="58" fill="#145753" font-family="Arial, sans-serif" font-size="26" font-weight="900">読書タイマー</text>
    <text x="34" y="126" fill="#18212f" font-family="Arial, sans-serif" font-size="58" font-weight="900">14:32</text>
  </g>
  <g transform="translate(480 374)">
    <rect width="250" height="168" rx="18" fill="#f6eadf"/>
    <rect x="36" y="48" width="34" height="86" rx="8" fill="url(#bookA)"/>
    <rect x="82" y="28" width="34" height="106" rx="8" fill="url(#bookB)"/>
    <rect x="128" y="62" width="34" height="72" rx="8" fill="url(#bookC)"/>
    <rect x="174" y="40" width="34" height="94" rx="8" fill="#4a9f69"/>
    <text x="36" y="152" fill="#667085" font-family="Arial, sans-serif" font-size="19" font-weight="800">本棚と進みぐあい</text>
  </g>
  <g transform="translate(770 374)">
    <rect width="270" height="168" rx="18" fill="#eef0fb"/>
    <rect x="36" y="42" width="34" height="92" rx="12" fill="#e66f51"/>
    <rect x="84" y="72" width="34" height="62" rx="12" fill="#f7c948"/>
    <rect x="132" y="25" width="34" height="109" rx="12" fill="#247c78"/>
    <rect x="180" y="56" width="34" height="78" rx="12" fill="#4552a3"/>
    <text x="36" y="152" fill="#667085" font-family="Arial, sans-serif" font-size="19" font-weight="800">今週の読書</text>
  </g>
  <g transform="translate(836 120)">
    <circle cx="74" cy="74" r="70" fill="#fff" stroke="#f7c948" stroke-width="10"/>
    <text x="74" y="91" text-anchor="middle" fill="#e66f51" font-family="Arial, sans-serif" font-size="58" font-weight="900">読</text>
  </g>
</svg>
